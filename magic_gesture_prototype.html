<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ドラクエソード風 魔法ジェスチャー プロトタイプ</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #0a0a14;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    color: #eee; overflow: hidden;
  }
  #stage {
    position: relative; width: 100vw; height: 100vh;
  }
  video, canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover;
  }
  video { transform: scaleX(-1); } /* 鏡合わせ表示 */
  #overlay { transform: scaleX(-1); z-index: 2; }
  #fx { z-index: 3; transform: none; pointer-events: none; }
  #hud {
    position: absolute; top: 12px; left: 12px; z-index: 5;
    background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px;
    font-size: 14px; line-height: 1.6; max-width: 320px;
  }
  #status {
    position: absolute; top: 12px; right: 12px; z-index: 5;
    background: rgba(0,0,0,0.55); padding: 8px 14px; border-radius: 8px;
    font-size: 14px;
  }
  #bar-wrap {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    width: 260px; height: 10px; background: rgba(255,255,255,0.15);
    border-radius: 5px; overflow: hidden; z-index: 5;
  }
  #bar {
    height: 100%; width: 0%; background: linear-gradient(90deg,#5ad8ff,#7c4dff);
    transition: width 0.05s linear;
  }
  #cast-flash {
    position: absolute; inset: 0; background: radial-gradient(circle, rgba(124,77,255,0.55), transparent 60%);
    opacity: 0; z-index: 4; pointer-events: none;
  }
  .flash-anim { animation: flashOut 0.5s ease-out forwards; }
  @keyframes flashOut { 0% { opacity: 1; } 100% { opacity: 0; } }
  #start-btn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 10; padding: 14px 28px; font-size: 16px; border-radius: 8px;
    border: none; background: #7c4dff; color: white; cursor: pointer;
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <canvas id="fx"></canvas>
  <div id="cast-flash"></div>

  <button id="start-btn">カメラを起動して開始</button>

  <div id="hud">
    <b>操作方法</b><br>
    手のひらを開いた状態で、カメラに向かって<br>
    素早く<b>突き出す</b>と魔法が発動します。<br>
    (力士の突っ張りのイメージ)
  </div>
  <div id="status">初期化中...</div>
  <div id="bar-wrap"><div id="bar"></div></div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const fx = document.getElementById('fx');
const fctx = fx.getContext('2d');
const statusEl = document.getElementById('status');
const barEl = document.getElementById('bar');
const flashEl = document.getElementById('cast-flash');
const startBtn = document.getElementById('start-btn');

let handLandmarker = null;
let running = false;

// ---- サイズ履歴（手の"大きさ"の急拡大を検知するため） ----
const HISTORY_LEN = 12;       // 保持するフレーム数
const TRIGGER_RATIO = 1.35;   // 直近平均に対してこの倍率を超えたら発動
const COOLDOWN_MS = 900;      // 発動後のクールダウン
let sizeHistory = [];
let lastCastTime = 0;

function resizeCanvases() {
  const w = window.innerWidth, h = window.innerHeight;
  [overlay, fx].forEach(c => { c.width = w; c.height = h; });
}
window.addEventListener('resize', resizeCanvases);
resizeCanvases();

async function setup() {
  statusEl.textContent = 'モデル読み込み中...';
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 1
  });

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480 }, audio: false
  });
  video.srcObject = stream;
  await new Promise(res => video.onloadedmetadata = res);
  video.play();

  statusEl.textContent = '手を映してください';
  running = true;
  requestAnimationFrame(loop);
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// 指が伸びているか（開いた手か）を簡易判定
function isOpenPalm(lm) {
  const wrist = lm[0];
  const tips = [8, 12, 16, 20];   // 人差し指〜小指の先端
  const mcps = [5, 9, 13, 17];    // 対応する付け根
  let extendedCount = 0;
  for (let i = 0; i < 4; i++) {
    if (dist(lm[tips[i]], wrist) > dist(lm[mcps[i]], wrist) * 1.15) extendedCount++;
  }
  return extendedCount >= 3; // 4本中3本以上伸びていれば開いた手とみなす
}

function triggerMagic(originX, originY) {
  const now = performance.now();
  if (now - lastCastTime < COOLDOWN_MS) return;
  lastCastTime = now;

  flashEl.classList.remove('flash-anim');
  void flashEl.offsetWidth; // reflow でアニメーション再トリガー
  flashEl.classList.add('flash-anim');

  spawnFireball(originX, originY);
}

// ---- 簡易パーティクル演出 ----
let particles = [];
function spawnFireball(ox, oy) {
  const targetX = fx.width / 2;
  const targetY = fx.height * 0.35;
  for (let i = 0; i < 40; i++) {
    particles.push({
      x: ox, y: oy,
      vx: (targetX - ox) / 26 + (Math.random() - 0.5) * 4,
      vy: (targetY - oy) / 26 + (Math.random() - 0.5) * 4,
      life: 1,
      size: 4 + Math.random() * 6,
      hue: 250 + Math.random() * 40
    });
  }
}
function renderParticles() {
  fctx.clearRect(0, 0, fx.width, fx.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
    fctx.globalAlpha = Math.max(p.life, 0);
    fctx.fillStyle = `hsl(${p.hue}, 90%, 65%)`;
    fctx.beginPath();
    fctx.arc(p.x, p.y, p.size * Math.max(p.life,0), 0, Math.PI * 2);
    fctx.fill();
  });
  fctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);
}

function loop() {
  if (!running) return;
  const now = performance.now();
  const result = handLandmarker.detectForVideo(video, now);

  octx.clearRect(0, 0, overlay.width, overlay.height);

  if (result.landmarks && result.landmarks.length > 0) {
    const lm = result.landmarks[0];

    // 画面座標に変換して骨格を描画
    const scaleX = overlay.width, scaleY = overlay.height;
    octx.strokeStyle = '#5ad8ff';
    octx.lineWidth = 2;
    const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],[0,17]];
    HAND_CONNECTIONS.forEach(([a,b]) => {
      octx.beginPath();
      octx.moveTo(lm[a].x*scaleX, lm[a].y*scaleY);
      octx.lineTo(lm[b].x*scaleX, lm[b].y*scaleY);
      octx.stroke();
    });
    octx.fillStyle = '#7c4dff';
    lm.forEach(p => {
      octx.beginPath();
      octx.arc(p.x*scaleX, p.y*scaleY, 4, 0, Math.PI*2);
      octx.fill();
    });

    // 手のサイズ (手首 - 中指付け根の距離。カメラに近づくほど大きくなる)
    const size = dist(lm[0], lm[9]);
    sizeHistory.push(size);
    if (sizeHistory.length > HISTORY_LEN) sizeHistory.shift();

    const avgPast = sizeHistory.slice(0, -1).reduce((a,b) => a+b, 0) / Math.max(sizeHistory.length - 1, 1);
    const ratio = avgPast > 0 ? size / avgPast : 1;

    barEl.style.width = Math.min(Math.max((ratio - 1) / (TRIGGER_RATIO - 1), 0), 1) * 100 + '%';

    const open = isOpenPalm(lm);
    statusEl.textContent = open ? '手のひら検出中（開）' : '手のひら検出中（閉）';

    if (open && ratio > TRIGGER_RATIO && sizeHistory.length >= HISTORY_LEN) {
      // 鏡表示に合わせてx座標を反転した位置から発射
      const originX = fx.width - (lm[9].x * scaleX);
      const originY = lm[9].y * scaleY;
      triggerMagic(originX, originY);
      sizeHistory = []; // 誤連射防止のため履歴リセット
    }
  } else {
    statusEl.textContent = '手が見つかりません';
    barEl.style.width = '0%';
  }

  renderParticles();
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', async () => {
  startBtn.style.display = 'none';
  try {
    await setup();
  } catch (e) {
    statusEl.textContent = 'エラー: ' + e.message;
    console.error(e);
  }
});
</script>
</body>
</html>
